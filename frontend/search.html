<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Buddy 검색</title>
  <link rel="stylesheet" href="search.css" />
</head>
<body>
  <div class="app">
    <section class="screen active">
      <div class="top-bar">
        <button id="regionBtn" class="region-btn">
          <span id="selectedRegionText">서울특별시</span> ▼
        </button>
      </div>

      <h2>검색</h2>

      <div class="search-box">
        <span>🔍</span>
        <input id="searchInput" placeholder="어디로 떠나볼까요?" />
        <button id="searchBtn">검색</button>
      </div>

      <h3 class="section-title">추천 관광지</h3>

      <div class="category-tabs">
        <button class="category active" data-type="">전체</button>
        <button class="category" data-type="12">자연</button>
        <button class="category" data-type="14">문화·역사</button>
        <button class="category" data-type="39">맛집</button>
      </div>

      <div id="searchGrid" class="search-grid"></div>
      <div id="searchList" class="search-list hidden"></div>

      <p id="loadingText" class="loading-text">불러오는 중...</p>
    </section>

<nav class="bottom-nav">
  <button class="nav-item">
    <span class="nav-icon">⌂</span>
    <span class="nav-text">홈</span>
  </button>

  <button class="nav-item nav-active">
    <span class="nav-icon">⌕</span>
    <span class="nav-text">검색</span>
  </button>

  <button class="nav-item">
    <span class="nav-icon">⌖</span>
    <span class="nav-text">주변</span>
  </button>

  <button class="nav-item">
    <span class="nav-icon">♧</span>
    <span class="nav-text">메이트</span>
  </button>

  <button class="nav-item">
    <span class="nav-icon">♡</span>
    <span class="nav-text">MY</span>
  </button>
</nav>

    <div id="regionModal" class="modal-bg hidden">
      <div class="region-modal">
        <div class="modal-header">
          <button id="closeRegionBtn">←</button>
          <strong>지역 설정</strong>
        </div>

        <p class="label">도 / 광역시</p>

        <div class="dropdown-box">
          <button id="areaDropdownBtn" class="dropdown-btn" type="button">
            <span id="areaDropdownText">서울특별시</span>
            <span>▼</span>
          </button>

          <div id="areaDropdownList" class="dropdown-list hidden"></div>
        </div>

        <p class="label">시 / 구</p>

        <div class="dropdown-box">
          <button id="sigunguDropdownBtn" class="dropdown-btn" type="button">
            <span id="sigunguDropdownText">전체</span>
            <span>▼</span>
          </button>

          <div id="sigunguDropdownList" class="dropdown-list hidden"></div>
        </div>

        <div class="modal-actions">
          <button id="cancelRegionBtn" class="cancel-btn">취소</button>
          <button id="applyRegionBtn" class="apply-btn">적용하기</button>
        </div>
      </div>
    </div>
  </div>

  <script src="search.js"></script>
</body>
</html>
