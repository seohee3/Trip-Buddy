<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Buddy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <section id="nearby" class="screen active">
      <div class="top-bar">
        <select>
          <option>서울특별시</option>
          <option>부산광역시</option>
          <option>제주특별자치도</option>
        </select>
        <button class="back-btn">←</button>
      </div>

      <h2>주변</h2>

      <div class="tabs">
        <button class="tab active">추천순</button>
        <button class="tab">거리순</button>
        <button class="tab">인기순</button>
      </div>

      <div class="search-row">
        <span>현재 위치 기준 3km 이내</span>
        <button id="locationBtn">검색 🔍</button>
      </div>
      <p id="locationInfo">
        현재 위치 정보가 표시됩니다.
      </p>

      <div class="map-box">
        <div class="map-dot blue"></div>
        <div class="map-dot green"></div>
        <div class="map-dot red"></div>
        <div class="map-dot yellow"></div>
        <p>지도 영역</p>
      </div>

      <div class="place-list">
        <article class="place-card">
          <div class="place-img img1"></div>
          <div>
            <h3>서울숲</h3>
            <p>서울 성동구</p>
            <span>⭐ 4.7 · 1.2km</span>
          </div>
        </article>

        <article class="place-card">
          <div class="place-img img2"></div>
          <div>
            <h3>한강공원</h3>
            <p>공원 · 자연</p>
            <span>⭐ 4.6 · 1.8km</span>
          </div>
        </article>

        <article class="place-card">
          <div class="place-img img3"></div>
          <div>
            <h3>성수동 카페거리</h3>
            <p>카페 · 맛집</p>
            <span>⭐ 4.5 · 2.1km</span>
          </div>
        </article>
      </div>
    </section>

    <section id="my" class="screen">
      <header class="profile-header">
        <button class="back-btn">←</button>
        <h2>마이페이지</h2>
      </header>

      <div class="profile">
        <div class="avatar">🐶</div>
        <div>
          <h3>모리토리</h3>
          <p>여행을 좋아하는 모리토리</p>
        </div>
      </div>

      <div class="profile-buttons">
        <button>프로필 편집</button>
        <button id="openRecordForm">+ 여행 기록 추가</button>
      </div>

      <div class="stats">
        <div><strong>23</strong><span>게시물</span></div>
        <div><strong>7</strong><span>동행</span></div>
        <div><strong>48</strong><span>방문 장소</span></div>
      </div>

      <div class="menu-grid">
        <button>여행 지도</button>
        <button>마스코트 도감</button>
      </div>
      <h3 class="section-title">나의 여행 기록</h3>
      <div id="recordList" class="record-list"></div>

      <div class="photo-grid">
        <div class="photo p1"></div>
        <div class="photo p2"></div>
        <div class="photo p3"></div>
        <div class="photo p4"></div>
        <div class="photo p5"></div>
        <div class="photo p6"></div>
      </div>
    </section>

    <section id="record" class="screen">
      <header class="profile-header">
        <button id="backToMy" class="back-btn">←</button>
        <h2>여행 기록</h2>
        <button id="saveRecordBtn" class="save-btn">완료</button>
      </header>

      <div class="form-card">
        <label>방문 일정</label>
        <button id="openCalendar" class="date-btn">
          <span id="selectedDateText">2026.05.20 ~ 2026.05.25</span>
        </button>

        <label>사진 추가</label>
        <div class="upload-row">
          <div class="upload-photo"></div>
          <div class="upload-photo"></div>
          <button class="add-photo">+</button>
        </div>

        <label>글 작성</label>
        <label>여행 제목</label>
        <input id="recordTitle" class="text-input" placeholder="예: 제주도 여행" />
        <textarea id="recordContent" placeholder="오늘의 여행 기록을 남겨보세요."></textarea>
        
        

        <label>공개 설정</label>
        <div class="radio-box selected">현재 공개</div>
        <div class="radio-box">나만 보기</div>
      </div>
    </section>

    <section id="calendar" class="screen">
      <header class="profile-header">
        <button id="backToRecord" class="back-btn">←</button>
        <h2>방문 일정</h2>
        <button id="calendarDoneBtn" class="save-btn">완료</button>
      </header>

      <div class="calendar-card">
        <div class="date-range">
            <div>
                <span>시작일</span>
                <strong id="startDateText">선택 전</strong>
             </div>
            <div>
                <span>종료일</span>
                <strong id="endDateText">선택 전</strong>
            </div>
        </div>
        <h3>2026년 5월</h3>

        <div class="calendar-grid">
            <button></button><button></button><button></button><button></button>
            <button data-day="1">1</button><button data-day="2">2</button><button data-day="3">3</button>
            <button data-day="4">4</button><button data-day="5">5</button><button data-day="6">6</button><button data-day="7">7</button><button data-day="8">8</button><button data-day="9">9</button><button data-day="10">10</button>
            <button data-day="11">11</button><button data-day="12">12</button><button data-day="13">13</button><button data-day="14">14</button><button data-day="15">15</button><button data-day="16">16</button><button data-day="17">17</button>
            <button data-day="18">18</button><button data-day="19">19</button><button data-day="20">20</button><button data-day="21">21</button><button data-day="22">22</button><button data-day="23">23</button><button data-day="24">24</button>
            <button data-day="25">25</button><button data-day="26">26</button><button data-day="27">27</button><button data-day="28">28</button><button data-day="29">29</button><button data-day="30">30</button><button data-day="31">31</button>
        </div>

        <button id="calendarSaveBtn" class="submit-btn">저장하기</button>
      </div>
    </section>

    <nav class="bottom-nav">
      <button>홈</button>
      <button>검색</button>
      <button class="nav-active" data-target="nearby">주변</button>
      <button>메이트</button>
      <button data-target="my">MY</button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
