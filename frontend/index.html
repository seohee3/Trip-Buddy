<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Buddy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Trip Buddy</h1>
    </header>

    <main>
        <section class="card">
            <h2>📍 주변 관광지</h2>

            <button id="locationBtn">
                현재 위치 가져오기
            </button>

            <ul>
                <li>에버랜드 (1.2km)</li>
                <li>한국민속촌 (2.4km)</li>
                <li>광교호수공원 (3.1km)</li>
            </ul>
        </section>

        <section class="card">
            <h2>✈ 여행 기록</h2>

            <button id="recordBtn">
                여행 기록 추가
            </button>

            <div class="record">
                <h3>제주도 여행</h3>
                <p>2026.06.10 ~ 2026.06.13</p>
            </div>

            <div class="record">
                <h3>부산 여행</h3>
                <p>2026.05.03 ~ 2026.05.05</p>
            </div>

        </section>
    </main>

    <script src="app.js"></script>

</body>
</html>
